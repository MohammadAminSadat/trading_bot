name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target builder -t trading_engine_builder -f docker/dockerfile .

      - name: build binary
        run: docker build -t trading_engine -f docker/dockerfile .

      - name: Run debug tests
        run: |
              docker run --rm trading_engine_builder \
                ctest --test-dir /app/build/debug --output-on-failure
                
      - name: Run release tests
        run: |
              docker run --rm trading_engine_builder \
                ctest --test-dir /app/build/release --output-on-failure

      - name: Create container
        run: docker create --name trading_engine_tmp trading_engine

      - name: Extract binary
        run: docker cp trading_engine_tmp:/app/TradingEngine ./TradingEngine

      - name: Remove container
        run: docker rm trading_engine_tmp
      
      - name: Upload Trading Engine
        uses: actions/upload-artifact@v4
        with:
          name: trading-engine
          path: TradingEngine

